<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Project Data Platform{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}">Project Data Platform</a><nav><a href="{{ url_for('index') }}">Projects</a><a href="{{ url_for('settings') }}">Settings</a></nav></header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category,message in messages %}<p class="message {{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Local workspace · Data stays on this computer</footer>
</body>
</html>
